[package]
name = "deskbeam"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Portable peer-to-peer encrypted remote desktop"

[features]
default = []
codec-source = ["shiguredo_libvpx/source-build"]

[dependencies]
anyhow = "1.0.104"
bincode = "1.3"
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
hkdf = "0.13.0"
local-ip-address = "0.6.13"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
shiguredo_libvpx = "2026.2.0-canary.3"
getrandom = "0.3"
snow = "0.10.0"
spake2 = { version = "0.4.0", features = ["getrandom"] }
thiserror = "2.0.21"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi"] }

[profile.dev]
debug = 0
incremental = false

# Memory-friendly release profile: this repository is built on machines with
# limited free commit. The VP8 hot path is in prebuilt, optimized libvpx.
# For maximum throughput on a machine with plenty of RAM, use
# opt-level = 3, lto = "thin", codegen-units = 1.
[profile.release]
opt-level = 1
lto = false
codegen-units = 16
strip = true
